name: ci

on:
  push:
  pull_request:

jobs:
  firmware:
    name: firmware (testes + build ESP32)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Testes das conversões dos sensores (no PC)
        run: pio test -e native -v
      - name: Build para ESP32
        run: pio run -e esp32dev

  plataforma:
    name: plataforma (TimescaleDB + Mosquitto reais)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plataforma
    services:
      banco:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_DB: iot
          POSTGRES_USER: iot
          POSTGRES_PASSWORD: iot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iot -d iot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Broker Mosquitto
        working-directory: .
        run: docker run -d --name broker -p 1883:1883 -v "$PWD/infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint e formatação (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Testes (inclui ponta a ponta pelo broker)
        run: pytest -v
        env:
          TEST_DATABASE_URL: postgresql://iot:iot@localhost:5432/iot
          MQTT_TEST_HOST: localhost

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Imagem da plataforma
        run: docker build -t plataforma-iot plataforma
