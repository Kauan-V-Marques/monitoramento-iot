; Nó de monitoramento de máquinas (ESP32 + MQTT)
; Testes das conversões dos sensores no PC: pio test -e native

[platformio]
default_envs = esp32dev

[env]
test_framework = unity

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.0
; No CI não existe secrets.h: usa o exemplo
extra_scripts = pre:usar_secrets_exemplo.py

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
