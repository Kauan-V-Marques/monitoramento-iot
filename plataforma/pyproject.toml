[project]
name = "plataforma-iot"
version = "1.0.0"
description = "Ingestao MQTT, TimescaleDB, alertas e painel ao vivo para monitoramento de maquinas"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "aiomqtt>=2.3,<3",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plataforma*"]

[tool.setuptools.package-data]
plataforma = ["banco.sql", "painel/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["mqtt: precisa de um broker MQTT de verdade (MQTT_TEST_HOST)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
